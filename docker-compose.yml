services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=db
      - DB_NAME=women_ecommerce
      - DB_USER=root
      - DB_PASS=root

  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=women_ecommerce
    volumes:
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql
